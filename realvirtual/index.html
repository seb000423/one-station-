  <!-- The boot manifest, fetched before anything else can be decided (plan-731 5a).

       `readManifest()` is awaited before the SceneStore exists and before the
       start document is even known (`main.ts`), so this request sits at the
       head of a strictly serial chain: manifest → start document → GLB. Warming
       it costs nothing and saves one round trip off the critical path.

       The options must MATCH `BundledBackend._fetchJson()`, which issues
       `fetch(url, { cache: 'no-cache' })`, or the browser treats the preload as
       a different request and downloads the file twice — worse than not
       preloading at all:

         - `as="fetch"` because a `fetch()` is what consumes it. Without `as`
           Chrome discards the entry with "preload not used".
         - `crossorigin` because a `fetch()` without an explicit `credentials`
           option is `same-origin`, which in preload terms is the anonymous
           mode. Omitting it mismatches on a CDN sub-domain — which is exactly
           where our public demo is served from.

       Deliberately NOT `no-store`-shaped: the whole point of plan-726 §8 was
       that an unchanged manifest costs a conditional request, not a download.

       `./` rather than `/`: Vite prefixes the base only on hrefs it can
       resolve in `public/` at build time, and `project.json` is written by the
       deploy, not the build. A hard-coded `/project.json` therefore survived
       the `--base /demo/` build untouched and preloaded the ZONE root
       (`web.realvirtual.io/project.json`, 404, "preloaded but not used") while
       `BundledBackend` fetched `/demo/project.json`. The env placeholder is
       replaced by Vite's HTML transform, so the preload follows the base like
       every fetch in `_url()` does. -->
  <link rel="preload" href="./project.json" as="fetch" type="application/json" crossorigin />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; height: 100vh; overflow: hidden; background: #9a9a9a; }

    /* --- Global scrollbar styling ---
       Transparent track (no white background); the thumb is invisible by default
       and only fades in while the scrollable container is hovered. Applied
       app-wide so every UI window matches — including native scrollbars that
       don't use the .rv-scroll helper class. */

    *:hover { scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }

    /* Signal / node-link drag in progress. The body class was set but had NO

    /* --- Loading Overlay --- */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;

    #loading-overlay.hidden {

    #loading-overlay.fade-out {

      pointer-events: none;

    /* ── Robot cell (top view) ───────────────────────────────────────────
       SVG user origin (0,0) = robot base; 1 unit = 1 px at full width. Infeed
       belt left, outfeed belt right, both at the base's height. Reach 170 =
       upper arm 100 + forearm 55 + tool 15. The arm turns a full circle per cycle. While lifted, the
       links shorten in top view (scaleX = foreshortening) and the tool grows
       slightly (closer to the camera). One cycle = 2 s. */
    /* 70 % of the 720 px drawing; on short screens the height decides
       (viewBox aspect 720 / 265 = 2.717). Above the text: the arm sweeps across
       the brand on its empty return. */
    .rv-cell {
      position: relative; z-index: 1;
      display: block; width: min(504px, 100vw, calc((100vh - 300px) * 2.717)); height: auto;
      overflow: visible; pointer-events: none;
    }
    .rv-cell { --rv-out-to: 156px; --rv-belt-to: 156px; }
    .rv-cell * { transform-origin: 0 0; }
    .rv-cell .a1      { transform: rotate(0deg);          animation: rv-a1 2s infinite; }
    .rv-cell .a2      {                                   animation: rv-a2 2s infinite; }
    .rv-cell .a3pos   { transform: translate(100px, 0);   animation: rv-a3pos 2s infinite; }
    .rv-cell .a3      {                                   animation: rv-a3 2s infinite; }
    .rv-cell .wpos    { transform: translate(55px, 0);    animation: rv-wpos 2s infinite; }
    .rv-cell .lift    {                                   animation: rv-lift 2s infinite; }
    .rv-cell .finger-a { transform: translate(15px, -19px); animation: rv-finger-a 2s infinite; }
    .rv-cell .finger-b { transform: translate(15px, 19px);  animation: rv-finger-b 2s infinite; }
    .rv-cell .held    {                                   animation: rv-held 2s infinite step-end; }
    .rv-cell .in-box  {                                   animation: rv-in-box 2s infinite; }
    .rv-cell .out-box { transform: translate(var(--rv-out-to), 0);   animation: rv-out-box 2s infinite; }
    .rv-cell .in-belt {                                   animation: rv-in-belt 2s infinite; }
    .rv-cell .out-belt {                                  animation: rv-out-belt 2s infinite; }

    /* Near-continuous turn: 2 s per full circle, pick and place are short
       dwells (8 % ≈ 0.16 s each), the swings use soft easing so A1 barely stops.
       Pick at 180° (left) → carry over the top → place at 360° (right) → on
       through the bottom across the text → 540° ≡ 180°: the restart is seamless. */
    @keyframes rv-a1 {
      0%, 4%    { transform: rotate(180deg); animation-timing-function: cubic-bezier(.3, .1, .7, .9); }
      46%, 54%  { transform: rotate(360deg); animation-timing-function: cubic-bezier(.3, .1, .7, .9); }
      96%, 100% { transform: rotate(540deg); }
    }
    /* Foreshortening while lifted: upper arm 100 → 70, forearm 55 → 49.5. */
    @keyframes rv-a2 {
      0%, 4%, 46%, 54%, 96%, 100% { transform: scaleX(1); }
      25%, 75% { transform: scaleX(.7); }
    }
    @keyframes rv-a3pos {
      0%, 4%, 46%, 54%, 96%, 100% { transform: translate(100px, 0); }
      25%, 75% { transform: translate(70px, 0); }
    }
    @keyframes rv-a3 {
      0%, 4%, 46%, 54%, 96%, 100% { transform: scaleX(1); }
      25%, 75% { transform: scaleX(.9); }
    }
    @keyframes rv-wpos {
      0%, 4%, 46%, 54%, 96%, 100% { transform: translate(55px, 0); }
      25%, 75% { transform: translate(49.5px, 0); }
    }
    @keyframes rv-lift {
      0%, 4%, 46%, 54%, 96%, 100% { transform: scale(1); }
      14%, 36%, 64%, 86% { transform: scale(1.14); }
    }
    @keyframes rv-finger-a {
      0%, 53%, 100% { transform: translate(15px, -19px); }
      3%, 50%       { transform: translate(15px, -15px); }
    }
    @keyframes rv-finger-b {
      0%, 53%, 100% { transform: translate(15px, 19px); }
      3%, 50%       { transform: translate(15px, 15px); }
    }
    @keyframes rv-held { 0% { opacity: 0; } 3% { opacity: 1; } 51% { opacity: 0; } }
    /* Infeed box waits at the pick point, vanishes when gripped, rides in again. */
    @keyframes rv-in-box {
      0%, 3%     { transform: translate(0, 0); }
      3.1%, 50%  { transform: translate(-220px, 0); animation-timing-function: cubic-bezier(.3, 0, .4, 1); }
      93%, 100%  { transform: translate(0, 0); }
    }
    /* The placed box rides to the tail of the queue (--rv-out-to, set by the
       page: 156 px for an empty belt, 36 px less per queued box) and fades into
       the queue box that appears there. */
    @keyframes rv-out-box {
      0%, 50.9%  { transform: translate(var(--rv-out-to), 0); opacity: 0; }
      51%, 55%   { transform: translate(0, 0); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .7, 1); }
      90%, 100%  { transform: translate(var(--rv-out-to), 0); opacity: 1; }
    }
    /* Slats move with the box; 84 = 7 × 12 px pitch, so the reset is seamless. */
    @keyframes rv-in-belt {
      0%, 50%  { transform: translate(0, 0); animation-timing-function: cubic-bezier(.3, 0, .4, 1); }
      93%, 100% { transform: translate(84px, 0); }
    }
    /* --rv-belt-to = --rv-out-to rounded to the 12 px slat pitch: seamless reset. */
    @keyframes rv-out-belt {
      0%, 55%  { transform: translate(0, 0); animation-timing-function: cubic-bezier(.5, 0, .7, 1); }
      90%, 100% { transform: translate(var(--rv-belt-to), 0); }
    }

    /* Outfeed queue = load progress: one delivered box per load step. At the
       end of a carrying cycle the delivered box becomes a queue box in place. */
    .rv-cell .slot { opacity: 0; }
    .rv-cell .slot.on { opacity: 1; }
    /* Nothing earned to deliver: the robot swings empty-handed (and slowly). */
    .rv-cell.idle .held, .rv-cell.idle .out-box { visibility: hidden; }
    /* Load failed: the cell stops where it is, like an E-stop. */
    #loading-overlay.rv-fault .rv-cell * { animation-play-state: paused !important; }

    /* Version label — bottom of the splash, written in at build time. */
    .loader-version {
      position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));

    /* Status line — subtle */
    .loader-status {

      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.5px;

    .loader-status .model-name {

    }

    /* Progress bar */
    .loader-progress-wrap {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .loader-progress-track {
      width: min(220px, 60vw);
      height: 4px;
      background: #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
    }
    /* Full-width bar scaled from the left edge: progress and the sweep are
       transform-only (compositor), never width/margin (layout). main.ts sets
       `style.transform = scaleX(fraction)` for determinate progress. */
    .loader-progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e94078, #ff6b9d);
      border-radius: 3px;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.3s ease-out;
    }
    /* Indeterminate sweep when no real progress */
    .loader-progress-bar.indeterminate {
      transition: none;
      animation: progress-sweep 1.8s ease-in-out infinite;
    }
    .loader-progress-pct {
      color: #555;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      min-height: 14px;
    }
    /* Secondary line: what is happening + how long it should still take.
       Reserved height so the overlay never reflows as the text changes. */
    .loader-detail {
      color: #8a8a8a;
      font-family: 'Consolas', 'Monaco', monospace;
      transition: opacity 0.25s;
      font-size: 11px;
      letter-spacing: 0.3px;
      margin-top: 4px;
      min-height: 14px;
      text-align: center;
    }
    .loader-detail.warn { color: #b8860b; }
    .loader-detail.out { opacity: 0; }

    /* --- Error state --- */
    .loader-error {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(380px, 86vw);
      text-align: center;
    }
    .loader-error.hidden { display: none; }
    .loader-error-title {
      color: #ff6b6b;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .loader-error-detail {
      margin-top: 8px;
      color: #888;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }
    .loader-error-actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .loader-btn {
      appearance: none;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .loader-btn:hover { border-color: #666; color: #fff; }
    .loader-btn-primary {
      border-color: #e94078;
      background: linear-gradient(90deg, #e94078, #ff6b9d);
      color: #fff;
    }
    .loader-btn-primary:hover { filter: brightness(1.08); color: #fff; }

    /* Same shape as the old width/margin-left sweep (0→60%→0 wide, sliding
       0→20%→100%), expressed as translate + scale so it never touches layout.
       translateX(%) is relative to the bar's own width, which is the track. */
    @keyframes progress-sweep {
      0% { transform: translateX(0%) scaleX(0); }
      50% { transform: translateX(20%) scaleX(0.6); }
      100% { transform: translateX(100%) scaleX(0); }
    }
  </style>

  <!-- Splash boot phase = load step 1 (virtual, before the app code runs):
       the first robot turn delivers its box, then the cell swings empty and
       slowly until rv-splash-robot.ts takes over (data-rv-load). Same tail
       geometry and rates as the controller. -->
  <script>
    (function () {
      var cell = document.querySelector('#loading-overlay .rv-cell');
      var box = cell && cell.querySelector('.out-box');
      if (!box) return;
      var slots = cell.querySelectorAll('.slot');
      var n = 0;
      box.addEventListener('animationiteration', function () {
        if (cell.closest('[data-rv-load]') || n >= 1) return;
        slots[n++].classList.add('on');
        var to = 156 - 30 * n;
        cell.style.setProperty('--rv-out-to', to + 'px');
        cell.style.setProperty('--rv-belt-to', Math.round(to / 12) * 12 + 'px');
        cell.classList.add('idle');
        if (cell.getAnimations) {
          cell.getAnimations({ subtree: true }).forEach(function (a) { a.updatePlaybackRate(0.5); });
        }
      });
    })();
  </script>
