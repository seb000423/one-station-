<title>원오토메이션 × 코렌스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: centered logo + menu floating over a live 3D dispensing scene; station plan diagram below. Brand: black, white, teal #006282, cyan #00E8D0. */
:root{
  --ink:#050607; --ink2:#0d0f11; --line:#24282d; --fg:#f4f5f6; --mute:#9aa0a6;
  --teal:#006282; --cyan:#00e8d0; --cyan-ink:#021a18;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero with overlaid nav */
.hero{position:relative;height:calc(100vh - 330px);min-height:420px;overflow:hidden;isolation:isolate;background:var(--ink)}
.hero canvas,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(180deg,rgba(5,6,7,.88) 0%,rgba(5,6,7,.35) 22%,rgba(5,6,7,0) 42%,rgba(5,6,7,.15) 55%,rgba(5,6,7,.9) 100%)}
.nav{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .3s,backdrop-filter .3s}
.nav.solid{background:rgba(5,6,7,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav.solid .wrap{padding-block:16px 12px;gap:10px}
.nav .wrap{transition:padding .3s}
.nav .wrap{display:grid;justify-items:center;gap:18px;padding-block:28px 0;position:relative}
.logo img{height:clamp(26px,3.2vw,40px);width:auto;display:block}
.menu{display:flex;gap:clamp(22px,4.5vw,64px);list-style:none;margin:0;padding:0}
.menu a{text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.14em;color:rgba(255,255,255,.86);padding:4px 0;border-bottom:1px solid transparent}
.menu a:hover,.menu a:focus-visible{color:#fff;border-bottom-color:var(--cyan);outline:none}
.util{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:30px;display:flex;align-items:center;gap:16px;font-size:12.5px}
.lang{font-family:var(--mono);color:rgba(255,255,255,.8)} .lang b{color:#fff;font-weight:600}
.contact{border:1px solid rgba(255,255,255,.6);padding:5px 12px;text-decoration:none;font-weight:500;white-space:nowrap}
.contact:hover{border-color:var(--cyan);color:var(--cyan)}
.burger{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:26px}
.copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-35%);z-index:2;text-align:center}
.copy{transition:opacity .45s ease,transform .45s ease}
.hero.outro .copy{opacity:0;transform:translateY(-30%);pointer-events:none}
.hero.outro::after{opacity:.35;transition:opacity .45s}
.hero::after{transition:opacity .6s}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.24em;color:var(--cyan);margin:0 0 14px}
.hero h1{margin:0;font-size:clamp(32px,5.2vw,68px);font-weight:600;letter-spacing:-.035em;line-height:1.12;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero h1 span{font-weight:300}
.scroll{display:inline-block;margin-top:26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:rgba(255,255,255,.7);text-decoration:none}
.scroll::after{content:"";display:block;width:1px;height:34px;background:linear-gradient(var(--cyan),transparent);margin:10px auto 0}

/* station */
.station{padding-block:56px 64px;text-align:center}
#planWrap:not([hidden]),.about:not([hidden]){animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.menu a.on{color:#fff;border-bottom-color:var(--cyan)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.station h2{font-size:clamp(26px,3.2vw,40px);letter-spacing:-.025em;margin:0 0 26px;font-weight:600}
.open{display:inline-flex;align-items:center;gap:14px;background:var(--cyan);color:var(--cyan-ink);text-decoration:none;font-weight:700;font-size:16px;padding:16px 34px;letter-spacing:.16em;font-family:var(--mono);box-shadow:0 0 0 1px rgba(0,232,208,.4),0 14px 40px rgba(0,232,208,.18)}
.open:hover{filter:brightness(1.06)}
.open:focus-visible{outline:2px solid #fff;outline-offset:4px}
.open span{font-family:var(--mono)}
.viewer{margin-top:48px;display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--line);background:#1d2126;text-align:left}
.vbox{position:relative;height:clamp(480px,74vh,820px);overflow:hidden}
.vbox canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.vbox canvas:active{cursor:grabbing}
.hot{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#fff;cursor:default;transition:opacity .2s;margin:-12px 0 0 -12px}
.hs b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--teal);font-family:var(--mono);font-size:11.5px;box-shadow:0 0 0 3px rgba(0,232,208,.25),0 2px 8px rgba(0,0,0,.5)}
.hs span{font-size:12.5px;background:rgba(5,6,7,.82);padding:3px 8px;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:.18s;border-left:2px solid var(--cyan)}
.hs.on b{background:var(--cyan);color:var(--cyan-ink)}
.hs.on span,.hs:hover span{opacity:1;transform:none}
.hint{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55);pointer-events:none}
.legend{list-style:none;margin:0;padding:10px 0;border-left:1px solid var(--line);background:var(--ink2);overflow-y:auto;max-height:clamp(480px,74vh,820px)}
.legend li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 18px;border-bottom:1px solid #1a1e22;cursor:default}
.legend li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--teal);font-family:var(--mono);font-size:11px;font-weight:600}
.legend li strong{display:block;font-size:14px;font-weight:600}
.legend li small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
.legend li.on{background:#0f1a1a}
.legend li.on b{background:var(--cyan);color:var(--cyan-ink)}
@media (max-width: 900px){ .viewer{grid-template-columns:1fr} .vbox{height:62vh;min-height:380px} .legend{border-left:0;border-top:1px solid var(--line);max-height:none} .hs span{display:none} }
.note{margin:16px auto 0;color:var(--mute);font-size:13px;max-width:62ch}
footer{border-top:1px solid var(--line);padding-block:40px 48px;color:var(--mute);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer img{height:20px;width:auto;opacity:.85}
.sel{user-select:all;font-family:var(--mono);color:#d6dade}
.about{border-top:1px solid var(--line);padding-block:88px 96px;background:radial-gradient(ellipse at 85% 10%,rgba(0,232,208,.07),transparent 55%),var(--ink)}
.about-head{max-width:720px;margin-bottom:56px}
.about h2{font-size:clamp(32px,4.6vw,58px);line-height:1.15;letter-spacing:-.04em;font-weight:700;margin:14px 0 22px}
.about h2 em{font-style:normal;color:var(--cyan)}
.lead{color:var(--mute);margin:0;max-width:52ch}
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0;border:1px solid var(--line)}
.co{padding:34px 34px 30px;display:grid;gap:18px;align-content:start;min-width:0}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:40px}
.co-logo{height:28px;width:auto}
.wordmark{font-family:var(--sans);font-weight:700;font-size:28px;letter-spacing:.08em;color:#fff;line-height:1}
.role{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,232,208,.35);padding:4px 8px}
.co-name{margin:0;font-size:18px;font-weight:600}
.co dl{display:grid;grid-template-columns:110px 1fr;gap:12px 16px;margin:0;font-size:14.5px}
.co dt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.co dd{margin:0;color:#e3e6e9}
.mono{font-family:var(--mono)}
.copybtn{background:none;border:1px solid var(--line);color:var(--mute);font-size:11.5px;padding:2px 8px;margin-left:8px;cursor:pointer}
.copybtn:hover{color:var(--cyan);border-color:var(--cyan)}
.maplink{justify-self:start;color:var(--cyan);text-decoration:none;font-size:13px;border-bottom:1px solid rgba(0,232,208,.4);padding-bottom:2px}
.x{display:grid;place-items:center;padding:0 6px;color:var(--teal);font-size:28px;font-weight:300;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--ink2)}
footer{padding-block:28px 32px}
footer span{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em}
@media (max-width: 860px){
  .duo{grid-template-columns:1fr}
  .x{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
  .co{padding:26px 20px}
  .co dl{grid-template-columns:96px 1fr}
  .menu{display:none}
  .burger{display:block}
  .util .lang{display:none}
  .nav.open .menu{display:flex;flex-direction:column;align-items:center;gap:14px;background:rgba(5,6,7,.92);padding:18px 0;width:100%}
}
</style>
