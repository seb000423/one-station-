<title>EGR 페이스트 스테이션 콘솔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D viewport left, parameter rail right (POLYTWIN-style console). Single dark look by design. */
:root{
  --bg:#0b0d10; --panel:#101317; --panel2:#151a1f; --line:#232930; --fg:#e6e8eb; --mute:#8a929c; --dim:#5a626c;
  --accent:#00e8d0; --accent-ink:#021a18; --ok:#3ddc84; --ng:#ff4d4f; --warn:#ffb020; --brand:#006282;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow:hidden;word-break:keep-all}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:16px;height:52px;border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:5px 10px;font-size:12px;border-radius:3px;white-space:nowrap}
.back:hover,.back:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.crumb{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb{max-width:calc(50% - 230px)}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-weight:600;letter-spacing:.42em;font-size:17px;white-space:nowrap;color:#fff;padding-left:.42em}
.logo i{width:6px;height:6px;background:var(--accent);border-radius:50%;display:block}
.top{position:relative}
.lang{margin-left:auto}
.logo img{height:22px;width:auto;display:block}
.logo em{font-style:normal;color:var(--accent)}
.lang{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.lang b{color:var(--fg)}
main{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0}
.view{position:relative;min-width:0;min-height:0;overflow:hidden}
#c{display:block;width:100%;height:100%;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:absolute;pointer-events:none}
.hud > *{pointer-events:auto}
.card{background:rgba(13,16,20,.82);border:1px solid var(--line);backdrop-filter:blur(6px);border-radius:4px}
.tl{top:14px;left:14px;width:300px}
.status{padding:12px 14px;display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.srow{display:flex;align-items:center;gap:10px}
#phase{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;background:#20262d;color:var(--fg)}
#phase[data-p="running"],#phase[data-p="closing"],#phase[data-p="loading"]{background:var(--warn);color:#1a1200}
#phase[data-p="done"]{background:var(--accent);color:var(--accent-ink)}
#clock{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-left:auto}
#tw{display:flex;gap:4px}
#tw i{width:9px;height:9px;border-radius:50%;background:#2a3038;display:block}
#tw i.red.on{background:var(--ng);box-shadow:0 0 8px var(--ng)}
#tw i.amber.on{background:var(--warn);box-shadow:0 0 8px var(--warn)}
#tw i.green.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bar{height:3px;background:#20262d;position:relative}
#progBar{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;transition:width .3s}
.rline{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
.rline b{font-family:var(--mono);color:var(--accent);font-weight:600;min-width:20px}
.rline span{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ikwarn{font-size:11.5px;color:var(--warn)}
.tr{top:14px;right:14px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.chip{background:rgba(13,16,20,.82);border:1px solid var(--line);color:var(--mute);padding:6px 10px;font-size:12px;border-radius:3px;cursor:pointer}
.chip:hover{color:var(--fg)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip:focus-visible{outline:1px solid var(--accent)}
.bl{left:14px;bottom:62px}
#jread{display:block;line-height:1.9;padding:8px 12px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;max-width:560px}
#jread i{font-style:normal;color:var(--dim);margin-right:5px}
#jread span{margin-right:12px}
.bc{left:14px;right:14px;bottom:14px}
#steps{list-style:none;margin:0;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#steps li{flex:1 0 auto;padding:7px 10px;font-size:11.5px;color:var(--dim);background:rgba(13,16,20,.82);border-top:2px solid #20262d;white-space:nowrap}
#steps li b{font-family:var(--mono);margin-right:6px;font-weight:500}
#steps li.cur{color:var(--fg);border-top-color:var(--accent)}
#steps li.cur b{color:var(--accent)}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--warn);color:#1a1200;padding:8px 14px;font-size:12.5px;border-radius:3px;font-weight:600}

/* side panel */
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;flex:1;min-height:0}
.sec{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec h3{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vcard{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:10px 11px;border-radius:3px;cursor:pointer;display:grid;gap:3px}
.vcard strong{font-size:13px;font-weight:600}
.vcard span{font-size:11.5px;color:var(--mute)}
.vcard.on{border-color:var(--accent);background:#0a1c1b}
.vcard.on strong{color:var(--accent)}
.lbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;color:var(--fg)}
.lbl small{font-family:var(--mono);color:var(--mute);font-size:11px}
.lbl output{font-family:var(--mono);color:var(--accent);font-size:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{background:var(--panel2);border:1px solid var(--line);padding:8px 4px;font-size:12px;border-radius:3px;cursor:pointer;white-space:nowrap}
.seg button.on{border-color:var(--accent);color:var(--accent);background:#0a1c1b;font-weight:600}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg button:focus-visible,.vcard:focus-visible{outline:1px solid var(--accent)}
.cellchips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cellchips span{background:var(--panel2);border:1px solid var(--line);padding:7px 6px;font-size:11px;border-radius:3px;text-align:center;line-height:1.35}
.cellchips b{display:block}
.cellchips b{font-family:var(--mono);color:var(--accent);margin-right:4px}
#jread b{font-family:var(--mono);color:var(--accent);margin-right:8px}
.desc{font-size:12px;color:var(--mute);line-height:1.6;margin:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{display:grid;gap:4px}
.jrow{display:grid;grid-template-columns:auto 28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #1e242a;cursor:pointer}
.jrow:last-child{border-bottom:0}
.jrow input{accent-color:var(--accent);margin:0}
.jid{font-family:var(--mono);color:var(--accent);font-size:11.5px}
.jname{font-size:12.5px;min-width:0}
.jmeta{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;cursor:pointer}
.tg input{appearance:none;width:34px;height:18px;border-radius:10px;background:#2a3038;position:relative;cursor:pointer;margin:0;transition:background .2s}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#e6e8eb;transition:left .2s}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{left:18px;background:var(--accent-ink)}
.tg input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--panel2);padding:9px 10px;display:grid;gap:2px}
.kpi span{font-size:10.5px;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.kpi b{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi b.ok{color:var(--ok)} .kpi b.ng{color:var(--ng)}
#kTot{font-family:var(--mono);font-size:11px;color:var(--mute)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-weight:500;color:var(--mute);text-align:right;font-size:10.5px;padding:5px 4px;border-bottom:1px solid var(--line);letter-spacing:.04em}
td{text-align:right;padding:5px 4px;border-bottom:1px solid #1a1f25;font-family:var(--mono)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.code{color:var(--fg)}
.dim{color:var(--dim)}
tr.ngrow td{background:rgba(255,77,79,.07)}
.pill{font-size:10px;padding:2px 6px;border-radius:2px;font-weight:600;letter-spacing:.04em}
.pill.ok{background:var(--ok);color:#03210f}.pill.ng{background:var(--ng);color:#2a0405}
.pill.idle{background:#20262d;color:var(--mute)}.pill.run{background:var(--warn);color:#1a1200}
#ngNote{font-size:11.5px;color:var(--ng);margin:0;min-height:0}
#ngNote:empty{display:none}
.foot{border-top:1px solid var(--line);padding:12px 18px 14px;display:grid;gap:10px;background:var(--panel)}
.simrow{display:flex;align-items:center;gap:8px}
.simrow span{font-size:11px;font-family:var(--mono);color:var(--mute);letter-spacing:.1em}
.simrow .seg{flex:1}
.simrow .seg button{padding:5px 0;font-family:var(--mono);font-size:11.5px}
.actions{display:grid;grid-template-columns:1fr auto;gap:6px}
#start{background:#0a1716;border:1px solid var(--accent);color:var(--accent);padding:13px;font-weight:700;letter-spacing:.14em;font-size:13px;border-radius:3px;cursor:pointer}
#start:hover{background:var(--accent);color:var(--accent-ink)}
#start:disabled{opacity:.4;cursor:wait;background:#0a1716;color:var(--accent)}
#reset{background:var(--panel2);border:1px solid var(--line);padding:0 16px;border-radius:3px;cursor:pointer;color:var(--mute)}
#reset:hover{color:var(--fg)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:0}
.spec dt{color:var(--mute)} .spec dd{margin:0;font-family:var(--mono);font-size:11.5px;text-align:right}
@media (max-width: 900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .view{height:62vh;min-height:380px}
  .side{border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .crumb{display:none}
  .logo{letter-spacing:.18em;font-size:11.5px;margin-right:0}
  .tl{width:auto;right:14px;top:auto;bottom:14px}
  .status{padding:10px 12px;gap:8px}
  .tr{left:14px;right:14px;top:10px;max-width:none;justify-content:flex-start}
  .chip{padding:5px 8px;font-size:11.5px}
  .bl,.bc{display:none}
}
@media (prefers-reduced-motion: reduce){ #progBar{transition:none} }
</style>
