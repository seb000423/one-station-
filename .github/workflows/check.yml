name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: generated files are up to date
        run: |
          npm run gen:twin
          npm run bundle:twin
          git diff --exit-code -- schemas docs/one-twin assets/one-twin js/one-twin.js js/one-twin-sim.js
